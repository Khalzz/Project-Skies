[package]
name = "pankarta-software"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
sdl2 = {version = "*", default-features = false, features = ["raw-window-handle" ]}
winit = "0.30.11"
wgpu = "25"
tokio = { version = "*", features = ["full"] }
bytemuck = { version = "*", features = [ "derive" ] }
image = { version = "*", default-features = false, features = ["png", "jpeg"] }
anyhow = "*"
fs_extra = "*"
glob = "*"
rand = "0.8"
glyphon = "0.9"
rodio = "*"

# Physics
rapier3d = { version = "*", features = [ "simd-stable", "serde-serialize" ] }
nalgebra = "*"
rayon = "1"

# External file management
serde = { version = "1.0", features = ["derive"] }
ron = "*"

# Head tracking (TrackIR / OpenTrack). `status()` is true only after a frame
# has arrived, which is what the settings dot and the Retry button wait on.
head-tracking-rs = "0.2"
# Same crate sdl2's raw-window-handle feature already pulls in. Needed here so
# TrackIR can be given this game's window handle.
raw-window-handle = "0.6"

# Tooling
egui = "0.32"
egui-wgpu = "0.32"
eframe = "0.32"
egui_plot = "0.33"

# Examples in a subfolder of examples/ are listed here; ones directly in
# examples/ are found on their own.
[[example]]
name = "basic_window"
path = "examples/window/basic_window.rs"

[[example]]
name = "configurable_window"
path = "examples/window/configurable_window.rs"

[[example]]
name = "ui_components"
path = "examples/UI/components.rs"

[[example]]
name = "ui_greetings"
path = "examples/UI/greetings.rs"

[[example]]
name = "input"
path = "examples/input/input.rs"

[[example]]
name = "2d"
path = "examples/2D/2d.rs"

[[example]]
name = "model_viewer"
path = "examples/3D/model_viewer.rs"

[[example]]
name = "water"
path = "examples/3D/water/water.rs"

[dependencies.gltf]
version = "1.4"
features = ["extras", "names", "utils"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
