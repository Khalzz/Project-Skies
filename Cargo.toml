[package]
name = "project-skies"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
# The engine: window, rendering, physics, input, audio, UI, scenes and nodes.
pankarta-software = "0.1"

# Same versions the engine uses, so their types are the engine's own
# (an nalgebra Vector3 or a rapier RigidBody from another version wouldn't be).
nalgebra = "0.33"
rapier3d = { version = "0.26", features = [ "simd-stable", "serde-serialize", "parallel" ] }
egui = "0.32"
egui_plot = "0.33"
wgpu = "25"
glyphon = "0.9"
sdl2 = { version = "0.37", default-features = false, features = ["raw-window-handle"] }

tokio = { version = "1.45", features = ["full"] }
bytemuck = { version = "1.23", features = [ "derive" ] }
anyhow = "1.0"
rand = "0.8"

# External file management
serde = { version = "1.0", features = ["derive"] }
ron = "0.10"

# Head tracking (TrackIR / OpenTrack). `status()` is true only after a frame
# has arrived, which is what the settings dot and the Retry button wait on.
head-tracking-rs = "0.2"
# Same crate sdl2's raw-window-handle feature already pulls in. Needed here so
# TrackIR can be given this game's window handle.
raw-window-handle = "0.6"

[dependencies.gltf]
version = "1.4"
features = ["extras", "names", "utils"]

# Dev builds (plain `cargo run`) still optimize every dependency - our own
# code stays fast to compile and easy to debug, but libraries like the PNG
# decoder and glTF parser run 10-50x faster than unoptimized (model loading
# was mostly spent decoding textures). The first build after this recompiles
# the dependencies once; later builds are as quick as before.
[profile.dev.package."*"]
opt-level = 3
