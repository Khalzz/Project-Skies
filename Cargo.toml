[package]
name = "pankarta-software"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
sdl2 = {version = "*", default-features = false, features = ["raw-window-handle" ]}
wgpu = "25"
tokio = { version = "*", features = ["full"] }
bytemuck = { version = "*", features = [ "derive" ] }
image = { version = "*", default-features = false, features = ["png", "jpeg"] }
anyhow = "*"
rand = "0.8"
glyphon = "0.9"
rodio = "*"

# Physics
rapier3d = { version = "*", features = [ "simd-stable", "serde-serialize", "parallel" ] }
nalgebra = "*"

# External file management
serde = { version = "1.0", features = ["derive"] }
ron = "*"

# The game's debug windows (see DebugUi)
egui = "0.32"
egui-wgpu = "0.32"

# Examples in a subfolder of examples/ are listed here; ones directly in
# examples/ are found on their own.
[[example]]
name = "basic_window"
path = "examples/window/basic_window.rs"

[[example]]
name = "configurable_window"
path = "examples/window/configurable_window.rs"

[[example]]
name = "ui_components"
path = "examples/UI/components.rs"

[[example]]
name = "ui_greetings"
path = "examples/UI/greetings.rs"

[[example]]
name = "input"
path = "examples/input/input.rs"

[[example]]
name = "2d"
path = "examples/2D/2d.rs"

[[example]]
name = "model_viewer"
path = "examples/3D/model_viewer.rs"

[[example]]
name = "water"
path = "examples/3D/water/water.rs"

[[example]]
name = "free_camera"
path = "examples/3D/free_camera.rs"

[[example]]
name = "walking"
path = "examples/3D/walking/main.rs"

[[example]]
name = "particles"
path = "examples/3D/particles.rs"

[dependencies.gltf]
version = "1.4"
features = ["extras", "names", "utils"]

[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
